<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mylav ROI Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth-overlay" style="display:none"></div>

<div class="app-layout">

  <div id="selettore-lingua"></div>

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="brand-word" aria-label="MYLAV">
        <span>MYL</span>
        <svg class="brand-a" viewBox="0 0 100 100" aria-hidden="true">
          <polygon points="6,94 40,10 52,10 22,94" fill="#ce181e"/>
          <polygon points="94,94 60,10 48,10 78,94" fill="#0f76bc"/>
        </svg>
        <span>V</span>
        <span class="brand-reg">®</span>
      </div>
      <div class="brand-tag" data-i18n="brand.tagline">Il laboratorio dei <b>clinici</b> per i <b>clinici</b></div>
      <div class="brand-rule"></div>
      <span class="logo-sub">ROI Dashboard</span>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav">
      <!-- Populated by app.js -->
      <div class="sidebar-loading" data-i18n="stato.caricamento">Caricamento...</div>
    </nav>
  </aside>

  <!-- ── MAIN CONTENT ── -->
  <main class="main-content" id="main-content">
    <div class="page-loading">
      <div class="spinner"></div>
    </div>
  </main>

</div>

<script src="/vendor/chart.min.js"></script>
<script src="ricerca.js"></script>
<script src="i18n.js"></script>
<script src="calcolatore.js"></script>
<script src="app.js"></script>
<script src="importpdf.js"></script>
</body>
</html>
